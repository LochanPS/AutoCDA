# Render Blueprint — AutoCDA Verification API as a FREE Node web service.
# No Docker, no credit card. Render injects PORT; the server reads process.env.PORT.
# Free services spin down after ~15 min idle and cold-start on the next request.
services:
  - type: web
    name: autocda-verify-api
    runtime: node
    plan: free
    # npm install (not `npm ci`): tolerant of lockfile/npm-version drift between
    # the local npm 11 lockfile (lockfileVersion 3) and Render's bundled npm.
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run verify-api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Lock CORS to the deployed web app (change if your app URL changes):
      - key: CORS_ORIGIN
        value: https://auto-cda-phi.vercel.app
      # Free anonymous tier limit (requests per minute per IP):
      - key: ANON_RATE_LIMIT
        value: "30"
      # Add keys later for higher limits, e.g. API_KEYS=key1=600,key2
      # Self-serve keys: Render generates a stable secret → POST /api/keys mints
      # stateless signed keys at the keyed tier (no database needed).
      - key: KEY_SIGNING_SECRET
        generateValue: true
      # Keep-warm: self-ping the PUBLIC health URL every 10 min (< the ~15 min
      # idle window) so a running free instance keeps serving external traffic and
      # doesn't spin down. (A GitHub Actions cron also pings it as a cold backup.)
      - key: KEEP_WARM_MS
        value: "600000"
      - key: KEEP_WARM_URL
        value: https://autocda-verify-api.onrender.com/api/health
